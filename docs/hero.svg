<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .bubble{opacity:0;animation:pop 12s infinite}
      .b1{animation-delay:.4s}.b2{animation-delay:2.2s}.b3{animation-delay:4.4s}.b4{animation-delay:6.6s}.b5{animation-delay:8.6s}
      @keyframes pop{0%{opacity:0;transform:translateY(8px)}6%{opacity:1;transform:translateY(0)}88%{opacity:1}96%{opacity:0}100%{opacity:0}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
      .typing circle{animation:blink 1.2s infinite}
      .typing circle:nth-child(2){animation-delay:.2s}.typing circle:nth-child(3){animation-delay:.4s}
      @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
      .tick{stroke-dasharray:40;stroke-dashoffset:40;animation:draw 12s infinite}
      @keyframes draw{0%,74%{stroke-dashoffset:40}80%{stroke-dashoffset:0}96%{stroke-dashoffset:0}100%{stroke-dashoffset:40}}
      text{fill:#e6edf7}
    </style>
  </defs>
  <rect width="960" height="420" rx="18" fill="url(#bg)"/>

  <!-- title -->
  <text x="40" y="52" font-size="26" font-weight="700">Full AI Customer Service Handling</text>
  <text x="40" y="78" font-size="14" fill="#9fb3d1">Website chat → AI receptionist → live calendars → technician SMS → confirmed booking. No customer sign-in.</text>

  <!-- phone / chat -->
  <rect x="40" y="104" width="300" height="290" rx="22" fill="#0f172a" stroke="#27324a"/>
  <rect x="40" y="104" width="300" height="34" rx="22" fill="#111c33"/>
  <text x="62" y="127" font-size="13" fill="#9fb3d1">Nexroza Plumbing · online</text>

  <g class="bubble b1">
    <rect x="120" y="150" width="204" height="44" rx="14" fill="#2563eb"/>
    <text x="132" y="168" font-size="12">My gas water heater is leaking</text>
    <text x="132" y="185" font-size="12">in Scarborough, after 4 PM.</text>
  </g>
  <g class="bubble b2">
    <rect x="56" y="204" width="222" height="58" rx="14" fill="#1f2a44"/>
    <text x="68" y="222" font-size="12">Safety first: any gas smell or</text>
    <text x="68" y="238" font-size="12">flooding? If not, I need your name,</text>
    <text x="68" y="254" font-size="12">phone and postal code.</text>
  </g>
  <g class="bubble b3">
    <rect x="120" y="272" width="204" height="30" rx="14" fill="#2563eb"/>
    <text x="132" y="291" font-size="12">No smell. Sam · 416‑555‑0177 · M1B</text>
  </g>
  <g class="bubble b4">
    <rect x="56" y="312" width="250" height="44" rx="14" fill="#1f2a44"/>
    <text x="68" y="330" font-size="12">Submitted ✔ Reference NX‑7QK2… A</text>
    <text x="68" y="346" font-size="12">technician is being texted right now.</text>
  </g>
  <g class="bubble b5">
    <rect x="56" y="362" width="250" height="26" rx="13" fill="#0f5132"/>
    <text x="68" y="379" font-size="12" fill="#b7f7d0">Michael proposed Mon 5:30 PM — confirm?</text>
  </g>
  <g class="typing" transform="translate(64 380)">
    <circle cx="6" cy="0" r="3" fill="#9fb3d1"/><circle cx="16" cy="0" r="3" fill="#9fb3d1"/><circle cx="26" cy="0" r="3" fill="#9fb3d1"/>
  </g>

  <!-- pipeline -->
  <g font-size="12">
    <rect x="392" y="150" width="120" height="58" rx="12" fill="#111c33" stroke="url(#accent)"/>
    <text x="452" y="174" text-anchor="middle" font-weight="600">Foundry Agent</text>
    <text x="452" y="192" text-anchor="middle" fill="#9fb3d1">safety · intake</text>

    <rect x="560" y="150" width="120" height="58" rx="12" fill="#111c33" stroke="url(#accent)"/>
    <text x="620" y="174" text-anchor="middle" font-weight="600">MCP tools</text>
    <text x="620" y="192" text-anchor="middle" fill="#9fb3d1">8 secure tools</text>

    <rect x="728" y="110" width="190" height="52" rx="12" fill="#111c33" stroke="#27324a"/>
    <text x="823" y="131" text-anchor="middle" font-weight="600">Outlook calendars</text>
    <text x="823" y="149" text-anchor="middle" fill="#9fb3d1">live availability · booking</text>

    <rect x="728" y="180" width="190" height="52" rx="12" fill="#111c33" stroke="#27324a"/>
    <text x="823" y="201" text-anchor="middle" font-weight="600">Technician SMS</text>
    <text x="823" y="219" text-anchor="middle" fill="#9fb3d1">"YES / 5:30 PM / NO"</text>

    <rect x="728" y="250" width="190" height="52" rx="12" fill="#111c33" stroke="#27324a"/>
    <text x="823" y="271" text-anchor="middle" font-weight="600">Queues + database</text>
    <text x="823" y="289" text-anchor="middle" fill="#9fb3d1">async · idempotent · audited</text>
  </g>

  <!-- connectors -->
  <g stroke="#3b82f6" stroke-width="2" fill="none" opacity=".8">
    <path id="p1" d="M340 179 H392"/>
    <path id="p2" d="M512 179 H560"/>
    <path id="p3" d="M680 179 C700 179 700 136 728 136"/>
    <path id="p4" d="M680 179 C700 179 700 206 728 206"/>
    <path id="p5" d="M680 179 C700 179 700 276 728 276"/>
  </g>
  <g fill="#22d3ee" filter="url(#glow)">
    <circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.4s" begin="1.9s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.4s" begin="2.2s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle>
  </g>

  <!-- status strip -->
  <g font-size="12">
    <rect x="392" y="330" width="526" height="60" rx="12" fill="#0f172a" stroke="#27324a"/>
    <circle cx="416" cy="360" r="6" fill="#22c55e" class="pulse"/>
    <text x="432" y="356">new → matching → awaiting_technician → technician_proposed_time</text>
    <text x="432" y="374" fill="#9fb3d1">→ awaiting_customer_confirmation → <tspan fill="#b7f7d0" font-weight="600">confirmed</tspan> (Outlook event created)</text>
    <path class="tick" d="M880 352 l8 9 l16 -18" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
